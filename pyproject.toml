[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "arc-cli"
version = "0.1.3"
description = "A terminal-native agent runtime with branchable sessions and validated tool execution"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "httpx==0.28.1",
    "jsonschema==4.23.0",
    "prompt-toolkit==3.0.52",
]

[project.optional-dependencies]
dev = ["mypy==2.3.1", "ruff==0.15.0"]

[project.scripts]
arc = "arc_cli.cli:main"

[project.urls]
Repository = "https://github.com/AuroraEchos/Arc-CLI"

[tool.hatch.build.targets.wheel]
packages = ["src/arc_cli"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/arc_cli"]

[[tool.mypy.overrides]]
module = "jsonschema"
ignore_missing_imports = true
